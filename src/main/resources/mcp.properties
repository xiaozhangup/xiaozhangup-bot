# MCP 与兼容的 /send 共用此监听地址；两者均需要 Bearer token。
host=127.0.0.1
port=48247
# 首次启动自动生成随机 token 并保存在插件数据目录，不写入日志。
token=
# 允许的浏览器 Origin，以分号分隔；空值表示拒绝带 Origin 的请求。
allowed.origins=
# 服务端可分享的目录，以分号分隔；空值使用插件数据目录/mcp/share。
share.roots=
# 空值使用插件数据目录/mcp/downloads。
download.root=
max.file.bytes=20971520
inline.bytes=1048576
event.capacity=2000
action.timeout.seconds=30
max.sessions=32
