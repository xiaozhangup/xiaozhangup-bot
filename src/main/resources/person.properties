# 会话配置位于 person/profiles/*.properties，启用项在插件启动后自动生效。
# 下列白名单只用于首次升级迁移，新配置请使用独立会话文件。
# 旧群聊白名单（逗号分隔群号）
enabled.groups=

# 旧私聊白名单（逗号分隔好友 QQ）
enabled.users=

# bot 自己的 QQ 号，用于防止自我循环
bot.id=

# bot 在上下文里使用的昵称(写回历史给 AI 看)
bot.name=小张张张张

# AI 接口配置
ai.key=
ai.model=deepseek-flash
ai.url=https://api.deepseek.com

# 模型思考模式开关
# true  - 显式启用思考(reasoning),回复更深思熟虑但慢
# false - 显式关闭思考,响应更快,适合聊天风格模拟
# 留空  - 不传参,由模型默认决定
ai.thinking.enabled=false

# 以下旧参数只用于首次迁移；后续在每份会话配置中调整。
# 上下文历史条数
history.size=20

# 收到消息后的防抖等待秒数(期间收到新消息会重置计时,平静后才提交给 AI)
debounce.seconds=10

# 新版使用 group.max.wait.ms 限制群聊最长合并等待，不再使用 group.max.batch。
# 旧每字延迟迁移为 send.char.delay.ms；新版第一条也按本条字数延迟。
char.delay.ms=200

# 图片直接通过 image_url 内容块交给模型，使用原生识图能力，不再调用本地 OCR。
