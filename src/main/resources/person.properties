# 群聊白名单（逗号分隔群号）
enabled.groups=

# 私聊白名单（逗号分隔好友 QQ）
enabled.users=

# bot 自己的 QQ 号，用于防止自我循环
bot.id=

# bot 在上下文里使用的昵称(写回历史给 AI 看)
bot.name=小张张张张

# AI 接口配置
ai.key=
ai.model=glm-4.1v-thinking-flash
ai.url=https://open.bigmodel.cn/api/paas/v4/

# 模型思考模式开关
# true  - 显式启用思考(reasoning),回复更深思熟虑但慢
# false - 显式关闭思考,响应更快,适合聊天风格模拟
# 留空  - 不传参,由模型默认决定
ai.thinking.enabled=false

# 上下文历史条数（默认 20）
history.size=20

# 收到消息后的防抖等待秒数(期间收到新消息会重置计时,平静后才提交给 AI)
debounce.seconds=10

# 群聊缓冲区上限,达到立即提交(0 或留空=无上限;私聊永不受此限制)
group.max.batch=6

# <spilt> 段之间的发送间隔按"上一段字符数 × char.delay.ms"计算
# 默认 200 表示每个字符模拟 0.2 秒打字延迟
char.delay.ms=200

# 是否对图片消息启用 OCR 识别
ocr.enabled=true

# 调用 OCR 脚本的 Python 解释器(留空则使用 PYTHON 环境变量或 python3)
ocr.python=python3

# 单次 OCR 调用超时秒数
ocr.timeout.seconds=60
