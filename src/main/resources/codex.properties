# 允许使用 /x、/codex 和 /cli 的群号，以逗号分隔
enabled.groups=

# 允许直接对话的私聊 QQ 号，以逗号分隔；无需 /x 前缀
enabled.users=

# 将多个群和私聊映射到同一个实例，共享记录、容器和文件。
# 未配置时，群实例名为群号，私聊实例名为 private-<QQ号>。
# 实例名支持字母、数字、下划线和连字符，最长 64 字符。
# 示例：以下两个群和一个私聊共用群 123456 的原有容器和目录：
# session.group.123456=123456
# session.group.234567=123456
# session.private.345678=123456

# 每实例目录为 <groups.directory>/<实例名>/{workspace,home,codex}
groups.directory=
podman.path=/usr/bin/podman
container.image=localhost/qbot-codex:0.163.0-1
container.cpus=2
container.memory=3g
# 可按实例覆盖内存上限，例如 container.memory.746508299=12g；未配置的实例沿用默认值。
container.pids=256
# 宿主 Codex 登录目录；不配置 auth.home 时使用宿主 ~/.codex（不要复制到群容器）

# 按共享会话组开放工具；tools.<实例名> 覆盖默认列表，留空则关闭该组全部扩展工具。
# 新工具 todoist、read_mail 默认关闭，凭据沿用 doist_task、mail_summary 配置。
tools.default=send_qq_file,list_qq_group_files,download_qq_group_file
# tools.959750158=send_qq_file,list_qq_group_files,download_qq_group_file,todoist,read_mail
