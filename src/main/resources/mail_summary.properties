# 推送目标群号
notification.target=

# AI 配置（与 task_abstract 一致：OpenAI 兼容 /chat/completions）
ai.key=
ai.model=glm-4.1v-thinking-flash
ai.url=https://open.bigmodel.cn/api/paas/v4/

# 正文截断长度（控制 token 成本）
ai.body.maxChars=2000

# 一时段全部为空时是否仍推送提示
push.empty=true

# 关键词预过滤（命中即跳过 AI，逗号分隔；置空可关闭）
prefilter.keywords=unsubscribe,退订,验证码,verification code

# 邮箱（编号从 1 开始，按 mailbox.N.* 解析）
# mailbox.1.host=imap.qq.com
# mailbox.1.port=993
# mailbox.1.user=user@qq.com
# mailbox.1.password=app-password
# mailbox.1.label=个人邮箱
# mailbox.1.ssl=true
